services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.dev
    ports:
      - "8080:8080"
    volumes:
      - .:/app
      - go-pkg-cache:/go/pkg
    environment:
      - LOCAL_RECIPES_DB_DSN=postgres://postgres:postgres@postgres:5432/local_recipes?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  mcpserver:
    build:
      context: .
      dockerfile: Dockerfile.dev
    command: ["go", "run", "./cmd/mcpserver"]
    ports:
      - "8090:8090"
    volumes:
      - .:/app
      - go-pkg-cache:/go/pkg
    environment:
      - LOCAL_RECIPES_MCP_AUTH_MODE=header
      - LOCAL_RECIPES_MCP_DB_DSN=postgres://postgres:postgres@postgres:5432/local_recipes?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=local_recipes
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  frontend:
    image: node:20-alpine
    working_dir: /app
    command: sh -c "npm install && npm start"
    ports:
      - "3000:3000"
    volumes:
      - ./app/local-recipes:/app
      - frontend-node-modules:/app/node_modules
    environment:
      - CHOKIDAR_USEPOLLING=true
      - API_PROXY_TARGET=http://backend:8080
    restart: unless-stopped

volumes:
  go-pkg-cache:
  frontend-node-modules:
  postgres-data:
